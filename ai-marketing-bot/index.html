<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Marketing Bot</title><style>body{font:16px system-ui;background:#0c1424;color:#e9f0ff;margin:0}header{background:#17243a;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:30px auto;padding:0 20px}h1{margin:0;font-size:26px}.muted{color:#a8bad2}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}section{background:#17243a;border:1px solid #34445b;border-radius:14px;padding:22px;margin-bottom:20px}input,select,textarea{box-sizing:border-box;width:100%;background:#0c1424;color:white;border:1px solid #60718a;border-radius:8px;padding:11px;margin:7px 0 15px}label{display:block;font-size:14px}button{background:#4c8bf5;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer;margin:4px 5px 4px 0}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#394b65}.danger{background:#a84755}.item{border-top:1px solid #34445b;padding:16px 0}.tag{background:#304760;padding:5px 9px;border-radius:20px;font-size:12px}#message{min-height:24px;color:#a8d4ff}small{color:#c2d2e9}</style></head><body><header><div><h1>AI Marketing Bot</h1><small>Meta + Google Ads • Approval-first dashboard</small></div><span class="tag">MOCK MODE — NO LIVE SPEND</span></header><main><p class="muted">Create campaigns, request approval and review simulated metrics. No advertisements are published.</p><section><label for="token">Local admin token (kept in this browser tab only)</label><input id="token" type="password" autocomplete="off" placeholder="Enter ADMIN_TOKEN"><button id="connect">Unlock dashboard</button><div id="message" role="status"></div></section><div class="grid"><section><h2>Create campaign</h2><form id="campaign"><label>Platform<select name="platform"><option value="meta">Meta Ads</option><option value="google">Google Ads</option></select></label><label>Campaign name<input name="name" minlength="3" maxlength="120" required placeholder="Cosmetics launch"></label><label>Daily budget (₹1,000–₹3,000)<input name="dailyBudget" type="number" min="1000" max="3000" step="1" value="1500" required></label><label>Ad copy<textarea name="copy" minlength="5" maxlength="2000" required placeholder="Describe your offer"></textarea></label><button type="submit">Save draft</button></form></section><section><h2>Campaign approvals</h2><div id="campaigns">Unlock to load campaigns.</div></section></div><section><h2>Activity log</h2><div id="audit"></div></section></main><script src="/app.js" defer></script></body></html>
